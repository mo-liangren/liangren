<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>良人的小工具</title>
<link rel="icon" type="image/png" href="furina.png">
<style>
:root{
  --bg0:#0a0c10;
  --bg1:#11151c;
  --ui:255,255,255;
  --card:rgba(var(--ui),.045);
  --line:rgba(var(--ui),.09);
  --text:#f2f4f8;
  --muted:#8b93a3;
  --accent:#ff5a3c;
  --accent-rgb:255,90,60;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(120% 78% at 50% -12%, rgba(var(--accent-rgb),.11) 0%, rgba(var(--accent-rgb),0) 62%),
    linear-gradient(180deg,var(--bg1) 0%,var(--bg0) 100%);
  background-repeat:no-repeat;
  min-height:100vh;
}
.wrap{
  max-width:600px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;
  padding:28px 20px calc(24px + env(safe-area-inset-bottom));
}
.list{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.card{
  display:flex;align-items:center;gap:14px;
  min-height:72px;padding:16px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  text-decoration:none;color:var(--text);
  transition:transform .15s,border-color .2s,background .2s;
}
.card:active{transform:scale(.98)}
.card:hover{border-color:rgba(var(--accent-rgb),.4);background:rgba(var(--ui),.06)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ic{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(var(--accent-rgb),.12);
}
.ic svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.name{font-size:17px;font-weight:700;letter-spacing:.5px}
.desc{font-size:13px;color:var(--muted)}
.url{font-size:11px;color:var(--muted);opacity:.7;letter-spacing:.2px;
  font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.arrow{flex:0 0 auto;color:var(--muted)}
.arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

footer{margin-top:auto;padding-top:28px;text-align:center;font-size:12px;color:var(--muted);opacity:.7;letter-spacing:1px}

@media (min-width:768px){
  .wrap{padding-top:40px}
  .card{min-height:80px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="list" id="list" aria-label="站点列表"></nav>

  <footer>良人</footer>
</div>

<script>
/* ===== 在这里增删站点：一行一个，依次为名称、说明、完整网址 ===== */
const LINKS = [
  {
    name: "原神伤害计算器",
    desc: "角色伤害计算",
    url:  "https://mo-liangren.github.io/liangren/YsDmgCalc"
  },
  {
    name: "倒计时",
    desc: "有超时计时器、调色板功能",
    url:  "https://mo-liangren.github.io/liangren/Timer"
  },
  {
    name: "抽签排序",
    desc: "自定义总数，逐个抽签",
    url:  "https://mo-liangren.github.io/liangren/chouqian"
  }
];

const LINK_ICON = '<svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.2 1.2M14 10a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1l1.2-1.2"/></svg>';

function host(url){
  try{ const u=new URL(url); return u.host + u.pathname; }
  catch(e){ return url; }
}

const list = document.getElementById("list");
list.innerHTML = LINKS.map(function(item){
  return `
  <a class="card" href="${item.url}" target="_blank" rel="noopener">
    <span class="ic">${LINK_ICON}</span>
    <span class="body">
      <span class="name">${item.name}</span>
      <span class="desc">${item.desc}</span>
      <span class="url">${host(item.url)}</span>
    </span>
    <span class="arrow"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>
  </a>`;
}).join("");
</script>
</body>
</html>
